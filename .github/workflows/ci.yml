# Pipeline de Integración Continua (CI) — Proyecto Narval
# Ejecuta automáticamente las suites de Backend, Firmware y Frontend con reportes de cobertura.
name: Verificación de Calidad y Pruebas Narval

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pruebas-backend:
    name: Pruebas Backend (pytest + cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: narval-backend
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: narval-backend/requirements.txt

      - name: Instalar dependencias del backend
        run: pip install -r requirements.txt

      - name: Ejecutar pytest con cobertura y reporte JUnit
        env:
          DATABASE_URL: "sqlite:///:memory:"
          GEMINI_API_KEY: ""
        run: |
          mkdir -p ../docs/qa/reports
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml:../docs/qa/reports/backend-coverage.xml --junitxml=../docs/qa/reports/backend-junit.xml

      - name: Publicar reportes de pruebas del backend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-backend
          path: docs/qa/reports/backend-*

  pruebas-firmware:
    name: Pruebas Unitarias Firmware ESP32 (mocks MicroPython)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pytest y pytest-cov
        run: pip install pytest pytest-cov

      - name: Ejecutar pruebas unitarias del firmware con cobertura
        run: |
          mkdir -p ../docs/qa/reports
          pytest -v --cov=main --cov=boot --cov-report=term-missing --cov-report=xml:../docs/qa/reports/firmware-coverage.xml --junitxml=../docs/qa/reports/firmware-junit.xml

      - name: Publicar reportes de pruebas del firmware
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-firmware
          path: docs/qa/reports/firmware-*

  pruebas-frontend:
    name: Pruebas Frontend (Oxlint, TypeScript, Build y Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: narval-frontend
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: narval-frontend/package-lock.json

      - name: Instalar dependencias del frontend
        run: npm install

      - name: Ejecutar análisis estático (Oxlint)
        run: npm run lint

      - name: Compilar TypeScript y empaquetar con Vite
        run: npm run build

      - name: Ejecutar pruebas unitarias y de componentes con cobertura (Vitest)
        run: npm run test:coverage

      - name: Publicar reporte de cobertura del frontend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-frontend
          path: narval-frontend/coverage
